<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Customer Intelligence</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    #312e81,
                    #0f172a 45%,
                    #020617
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .login-container {

            width: 100%;

            max-width: 430px;

            padding: 20px;

        }


        .login-card {

            background:
                rgba(15, 23, 42, 0.92);

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius: 24px;

            padding: 40px;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.5);

            backdrop-filter:
                blur(15px);

        }


        .logo {

            width: 70px;

            height: 70px;

            margin:
                0 auto 20px;

            border-radius: 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #6366f1
                );

            box-shadow:
                0 10px 30px
                rgba(99,102,241,0.35);

        }


        h1 {

            margin: 0;

            text-align: center;

            font-size: 28px;

        }


        .subtitle {

            text-align: center;

            color: #94a3b8;

            font-size: 14px;

            margin:
                10px 0 30px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 14px;

            font-weight: 600;

        }


        input {

            width: 100%;

            padding: 14px 16px;

            border-radius: 10px;

            border:
                1px solid #334155;

            background: #1e293b;

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.25s;

        }


        input:focus {

            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px
                rgba(139,92,246,0.15);

        }


        input::placeholder {

            color: #64748b;

        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #6366f1
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;

        }


        .login-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(99,102,241,0.35);

        }


        .error {

            background:
                rgba(239,68,68,0.12);

            border:
                1px solid
                rgba(239,68,68,0.3);

            color: #fca5a5;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;

        }


        .demo-login {

            margin-top: 25px;

            padding: 14px;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.04);

            color: #94a3b8;

            text-align: center;

            font-size: 12px;

        }


        .demo-login strong {

            color: #c4b5fd;

        }


        .footer {

            text-align: center;

            margin-top: 20px;

            color: #64748b;

            font-size: 12px;

        }


        @media (max-width: 500px) {

            .login-card {

                padding: 30px 22px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="logo">

            🤖

        </div>


        <h1>

            Welcome Back

        </h1>


        <p class="subtitle">

            Customer Intelligence Dashboard

        </p>


        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}


        <form method="POST"
              action="{{ url_for('login') }}">


            <div class="form-group">

                <label for="username">

                    Username

                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label for="password">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="login-button">

                Login to Dashboard

            </button>


        </form>

        <div class="auth-footer">

    <span>
        Don't have an account?
    </span>

    <a href="{{ url_for('signup') }}">
        Create Account
    </a>

</div>


        <div class="demo-login">

            Demo Login:

            <strong>admin</strong>

            /

            <strong>admin123</strong>

        </div>


    </div>


    <div class="footer">

        Customer Intelligence Dashboard • Version 1.0.0

    </div>


</div>


</body>

</html>
